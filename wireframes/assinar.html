<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinar - HABIT</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/subscribe.css">
    <link rel="stylesheet" href="../css/footer-list.css">
</head>
<body>
    <div class="header"> 
        <div class="header__titulo">HABIT</div>

        <div class="header__space">
            <a href="home.html" class="header__link">Início</a>
            <a href="paginas.html" class="header__link">Páginas</a>
            <a href="destaques.html" class="header__link">Destaques</a>
            <a href="assinar.html" class="header__link">Assinar</a>
            <a href="admin.html" class="header__link">Admin</a>
        </div>

        <div class="header__actions">
            <input type="text" placeholder="Buscar...">
            <div class="button button--border">Buscar</div>
            <div class="button button--border">Entrar</div>
        </div>
    </div>

    <div class="subscribe-page">
        <div class="subscribe-page__card">
            <h1 class="subscribe-page__title">Assine a newsletter</h1>

            <div class="subscribe-page__form">
                <input type="email" placeholder="E-mail" class="subscribe-page__input">

                <div class="subscribe-page__checkbox-group">
                    <input type="checkbox" id="politica" class="subscribe-page__checkbox">
                    <label for="politica" class="subscribe-page__label">Concordo em receber comunicações e li a política de privacidade.</label>
                </div>

                <div class="subscribe-page__actions">
                    <button class="button button--preenchido">Assinar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-list">
        <div class="footer-list__card">Instagram</div>
        <div class="footer-list__card">Work</div>
        <div class="footer-list__card">Bags</div>
        <div class="footer-list__card">Lamp</div>
        <div class="footer-list__card">Books</div>
    </div>
</body>
</html>
